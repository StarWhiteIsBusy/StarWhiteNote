name: 自动更新知识库索引

on:
  push:
    paths:
      - 'notes/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 扫描 notes 目录并生成最新 notes.json
        run: |
          python build_notes.py

      - name: 检查是否有更新并自动提交
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add notes.json data/notes.json || true
          if git diff --staged --quiet; then
            echo "没有检测到索引变动，无需提交。"
          else
            git commit -m "🤖 [自动更新] 扫描 notes 目录并更新知识库索引 [skip ci]"
            git push origin main
          fi